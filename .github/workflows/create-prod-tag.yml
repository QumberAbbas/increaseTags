name: Create tag for prod branch

on:
  workflow_dispatch:
    inputs:
      fetch_translations:
        required: true
        type: boolean
        description: Should fetch latest translations

jobs:
  say_hello:
    runs-on: ubuntu-latest
    outputs:
      some-output: ${{ steps.get_previous_version.outputs.previous-release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Release Version
        id: get_version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/heads/release/}" >> $GITHUB_ENV

      - name: Slack Message
        run: |
          echo "🟢 Slack Message ${{ ENV.RELEASE_VERSION }}"

  publish_app_to_prod:
    runs-on: ubuntu-latest
    needs: say_hello
    environment:
      name: Publish App To Google Play Internal Channel
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}

      - name: Fetch translation
        if: ${{ github.event.inputs.fetch_translations == 'true' }}
        run: |
          echo "🟢 Translations are going to be fetched"

      - name: Create and push a tag
        run: |
          RELEASE_VERSION="${GITHUB_REF#refs/heads/release/}"
          git tag $RELEASE_VERSION
          git push origin $RELEASE_VERSION
      


