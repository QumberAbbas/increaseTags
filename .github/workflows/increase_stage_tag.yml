name: Ruby Script

on:
  push:

jobs:
  publish_tag:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get the version
        id: get_version
        run: echo "VERSION_NUMBER_CI=$(echo $GITHUB_REF | sed -n 's/refs\/tags\///p')" >> $GITHUB_ENV

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1
          bundler-cache: true

      - name: Install ruby script dependencies
        run: |
          chmod +x scripts/install_gems.sh
          ./scripts/install_gems.sh

      - name: Running tests
        run: echo "Running tests..."

      - name: Get Release Version To Be Created
        # This step will get the release version to be created from the version.properties file
        # This will also calculate the previous version
        id: get_release_versions
        run: |
          release_train_version=$(grep '^version=' version.properties | cut -d'=' -f2)
          echo "release_train_version=$release_train_version" >> $GITHUB_OUTPUT
          IFS='.' read -r -a version_parts <<< "$release_train_version"
          previous_release_train_version="${version_parts[0]}.${version_parts[1]}.$((${version_parts[2]} - 1))"
          echo "previous_release_train_version=$previous_release_train_version" >> $GITHUB_OUTPUT

      - name: Print Release Version To Be Created
        run: |
          echo "Release version to be created: ${{ steps.get_release_versions.outputs.release_train_version }}"
          echo "Previous Release version: ${{ steps.get_release_versions.outputs.previous_release_train_version }}"

      - name: Get the ticket number
        if : failure()
        run: echo "Failed"


