name: Ruby Script

on:
  push:

jobs:
  publish_tag:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get the version
        id: get_version
        run: echo "VERSION_NUMBER_CI=$(echo $GITHUB_REF | sed -n 's/refs\/tags\///p')" >> $GITHUB_ENV

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1
          bundler-cache: true

      - name: Install ruby script dependencies
        run: |
          chmod +x scripts/ruby_setup.sh
          ./scripts/install_gems.sh

      - name: Run Ruby script
        env:
          previous_release_branch: '1.0.10'
        run: ruby scripts/script.rb


