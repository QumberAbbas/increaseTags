name: Publish tag for development branch

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish_tag:

    runs-on: ubuntu-latest
    env:
      CACHE_NAME: cache-dependencies-${{ hashFiles('Gemfile.lock') }}

    steps:

      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Cache dependencies
        uses: actions/cache@v2
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-${{ env.CACHE_NAME }}
          restore-keys: |
            ${{ runner.os }}-${{ env.CACHE_NAME }}

      - name: Get the version
        id: get_version
        run: echo "VERSION_NUMBER_CI=$(echo $GITHUB_REF | sed -n 's/refs\/tags\///p')" >> $GITHUB_ENV

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.0.2

      - name: Install dependencies
        run: gem install git

      - name: Run Ruby script
        run: ruby scripts/script.rb

