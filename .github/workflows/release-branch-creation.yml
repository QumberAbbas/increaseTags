# This is a basic workflow that is manually triggered

name: Release Branch Creation

concurrency:
  group: production
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      release-branch-name:
        description: 'Creation of release branch'
        required: true
        type: string
    secrets:
       ANDROID_GITHUB_APP_ID:
          required: true
       ANDROID_GITHUB_APP_PRIVATE_KEY:
          required: true

  workflow_dispatch:
    inputs:
      release-branch-name:
        description: 'Creation of release branch'
        required: true
        type: string

jobs:
  say_hello:
    runs-on: ubuntu-latest
    outputs:
      some-output: ${{ steps.get_previous_version.outputs.previous-release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Say Hello
        id: get_previous_version
        run: echo "previous-release=1.0.1" >> $GITHUB_OUTPUT

  create-release-branch:
    runs-on: ubuntu-latest
    needs: say_hello
    environment:
      name: Release Train - Create Release Branch
      url: "https://github.com/QumberAbbas/increaseTags/compare/${{ needs.say_hello.outputs.some-output }}...${{ inputs.release-branch-name }}"
    steps:

      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Git configuration
        shell: bash
        run: |
          git config user.name "Qumber Abbas"
          git config user.email "github-actions@users.noreply.github.com"

      - name: Create new release branch
        shell: bash
        run: |
          git fetch origin develop
          git checkout develop
          git pull origin develop
          git checkout -b ${{ inputs.release-branch-name }} develop

      - name: Push release branch to remote
        shell: bash
        run: |
          git push origin ${{ inputs.release-branch-name }} 

      - name: Create file and add text
        run: |
          echo "Hello, world! How are you?" > example.txt
          echo "This is a test file." >> example.txt

      - name: Sync branch name
        shell: bash
        run: |
          echo "SYNC_RELEASE_BRANCH=sync/${{ inputs.release-branch-name }}-$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Create new sync branch
        shell: bash
        run: |
          git checkout -b ${{ env.SYNC_RELEASE_BRANCH }} ${{ inputs.release-branch-name }}   

      - name: Check for changes
        id: check_changes
        shell: bash
        run: |
          if [[ $(git status --porcelain) ]]; then
            echo "Changes detected."
            git add .
            git commit -m "Committing changes before creating PR"
          else
            echo "No changes detected."
          fi

      - name: Push sync branch to remote
        shell: bash
        run: |
          git push origin ${{ env.SYNC_RELEASE_BRANCH }} 

      - name: Get github token
        id: get_workflow_token
        uses: peter-murray/workflow-application-token-action@v3
        with:
          application_id: ${{ secrets.ANDROID_GITHUB_APP_ID }}
          application_private_key: ${{ secrets.ANDROID_GITHUB_APP_PRIVATE_KEY }}

      - name: Create Pull Request
        uses: actions/github-script@v6
        with:
          github-token: ${{ steps.get_workflow_token.outputs.token }}
          script: |
            const { repo, owner } = context.repo;
            const result = await github.rest.pulls.create({
              title: '[Automation] Sync release branch ${{ inputs.release-branch-name }} changes to develop',
              owner,
              repo,
              head: '${{ env.SYNC_RELEASE_BRANCH }}',
              base: 'develop',
              body: [
                'This is an auto-generated PR for syncing the changes from release branch to develop. It also includes increase of app version for next release.',
                'Sync release branch ${{ inputs.release-branch-name }} to develop'
              ].join('\n')
            });
