name: Workflow Build and Publish to Production
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-and-deploy-to-stage:
    
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:

      - name: Get the version
        id: get_version
        run: echo "RELEASE_BRANCH=release/$(echo $GITHUB_REF | sed -n 's/refs\/tags\///p'  | sed 's/\.[0-9]*$/\.0/')" >> $GITHUB_ENV   

      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Compare branches
        run: |
          git fetch origin develop
          git log origin/${{ env.RELEASE_BRANCH }} ^origin/develop --oneline

      - name: Get github token
        id: get_workflow_token
        uses: peter-murray/workflow-application-token-action@v3
        with:
          application_id: ${{ secrets.ANDROID_GITHUB_APP_ID }}
          application_private_key: ${{ secrets.ANDROID_GITHUB_APP_PRIVATE_KEY }}


      - name: Fetch Release Branch
        run: git fetch origin release/3.5.0
      
      - name: Create new branch
        run: |
          git checkout -b sync_release/3.5.0
          git rebase origin/release/3.5.0
          git push origin sync_release/3.5.0 -f
      
      - name: rebase new branch
        run: |
          git rebase origin/release/3.5.0
          git push origin sync_release/3.5.0 -f
          
      - name: push new branch
        run: |
          git push origin sync_release/3.5.0 -f

      - name: Compare branches two
        run: |
          git fetch origin develop
          git log origin/sync_release/3.5.0 ^origin/develop --oneline
          
      - name: Create Pull Request
        uses: actions/github-script@v6
        with:
          script: |
            const { repo, owner } = context.repo;
            const result = await github.rest.pulls.create({
              title: '[Example] Simple demo',
              owner,
              repo,
              head: 'release/3.5.0',
              base: 'develop',
              body: [
                'This PR is auto-generated by',
                '[actions/github-script](https://github.com/actions/github-script).'
              ].join('\n')
            });
        env:
          GITHUB_TOKEN: ${{ steps.get_workflow_token.outputs.token }}
