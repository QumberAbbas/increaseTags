name: Workflow Build and Publish to Production
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-and-deploy-to-stage:
    
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:

      - name: Get the version
        id: get_version
        run: echo "RELEASE_BRANCH=release/$(echo $GITHUB_REF | sed -n 's/refs\/tags\///p'  | sed 's/\.[0-9]*$/\.0/')" >> $GITHUB_ENV

      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: "${{ env.RELEASE_BRANCH }}"

      - name: Compare branches
        run: |
          git fetch origin develop
          git log origin/${{ env.RELEASE_BRANCH }} ^origin/develop --oneline

      - name: Get github token
        id: get_workflow_token
        uses: peter-murray/workflow-application-token-action@v3
        with:
          application_id: ${{ secrets.ANDROID_GITHUB_APP_ID }}
          application_private_key: ${{ secrets.ANDROID_GITHUB_APP_PRIVATE_KEY }}

      - name: Create new branch
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          timestamp=$(date +"%Y%m%d%H%M")
          git checkout ${{ env.RELEASE_BRANCH }}
          echo "SYNC_RELEASE_BRANCH=sync_release/5.0.0-$timestamp" >> $GITHUB_ENV
          git checkout -b ${{ env.SYNC_RELEASE_BRANCH }} ${{ env.RELEASE_BRANCH }}
          git push origin sync_release/5.0.0


      - name: Check for changes
        id: check_changes
        run: |
            if [[ $(git status --porcelain) ]]; then
              echo "Changes detected."
              git add .
              git commit -m "Committing changes before creating new branch"
              exit 0
            else
              echo "No changes detected."
              exit 1
            fi

      - name: Create new branch
        run: |
          git push origin ${{ env.SYNC_RELEASE_BRANCH }} 

      - name: Create Pull Request
        uses: actions/github-script@v6
        with:
          github-token: ${{ steps.get_workflow_token.outputs.token }}
          script: |
            const { repo, owner } = context.repo;
            const result = await github.rest.pulls.create({
              title: '[Example] Simple demo',
              owner,
              repo,
              head: 'sync_release/5.0.0',
              base: 'develop',
              body: [
                'This PR is auto-generated by',but
                '[actions/github-script](https://github.com/actions/github-script).'
              ].join('\n')
            });